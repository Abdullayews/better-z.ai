name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asılıqlar
        run: npm ci

      - name: Prod build (zip-lər)
        run: python3 build.py

      - name: SHA256SUMS
        run: |
          cd dist/zips
          rm -f SHA256SUMS.txt
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "better z.ai ${GITHUB_REF_NAME}" \
            --notes "$(cat <<'EOF'
          ## better z.ai — ${GITHUB_REF_NAME}

          **system is busy** və digər göndərmə xətalarında mesajı attachment-larla
          birlikdə avtomatik yenidən göndərən extension (Chrome + Firefox).

          ### Funksiyalar
          - 🔁 Şəbəkə-səviyyəli capture/replay — attachment-lar heç bir vaxt itmir
          - X-Signature yenidən imzalama, eksponensial + adaptiv backoff
          - 🖼️ Preview bloku (yalnız kliklə açılır)
          - 📝 Qaralama mühafizəsi, 🧷 mesaj xilası, ⚡ snippet kitabxanası
          - ⤓ Söhbətin ixracı + ⤓⤓ tam backup (.md + .json)
          - 🔔 "Cavab hazırdır" bildirişi, 🚪 popap bağlayıcı, ⏸ pauza
          - 🎯 Ardıcıl retry, 🛡️ dublikat qorunması, 🔤 söz sayğacı
          - ⌨️ Qısayollar: Alt+R (indi cəhd et), Alt+P (pauza), Alt+E (ixrac)

          ### Quraşdırma
          - **Chrome**: zip-i açın → chrome://extensions → Developer mode → Load unpacked → `chrome/`
          - **Firefox**: `better-z.ai-firefox.xpi` (və ya zip içindən `manifest.json`)
            → about:debugging → Load Temporary Add-on

          Testlər: unit 65/65, Chrome E2E 24 ssenari / 56 yoxlama, Firefox E2E 10
          yoxlama, addons-linter 0/0/0. SHA256SUMS.txt faylında imzalar.
          EOF
          )" \
            dist/zips/*.zip dist/zips/SHA256SUMS.txt
