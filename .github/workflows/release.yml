name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asılıqlar
        run: npm ci

      - name: Prod build (zip-lər)
        run: python3 build.py

      - name: SHA256SUMS
        run: |
          cd dist/zips
          rm -f SHA256SUMS.txt
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Z.ai Auto-Resend ${GITHUB_REF_NAME}" \
            --notes "$(cat <<'EOF'
          ## Z.ai Auto-Resend — ${GITHUB_REF_NAME}

          **system is busy** və digər göndərmə xətalarında mesajı attachment-larla
          birlikdə avtomatik yenidən göndərən extension (Chrome + Firefox).

          ### Bu versiyada (v1.3.0 — Sürət və nəzarət paketi)
          - ⌨️ **Qısayollar**: Alt+R (indi cəhd et), Alt+P (pauza), Alt+E (ixrac)
          - ⤓⤓ **Tam backup**: bütün söhbətlər bir kliklə .md + .json
          - 🔤 **Söz sayğacı** — kompozitor yanında canlı "N söz · M simvol"
          - 🔊 **"Cavab hazırdır" səsi** (Ayarlar-da açılır)
          - ⏱️ **Adaptiv backoff** — ardıcıl busy-də gözləmələr uzanır (maks ×3)
          - 🧪 **Diaqnostika ixracı** — xəta hesabatı üçün tam JSON (popup)
          - Əvvəlki: şəbəkə-səviyyəli capture/replay, X-Signature yenidən imzalama,
            preview bloku, qaralama mühafizəsi, snippet kitabxanası, popap bağlayıcı,
            ardıcıl retry, dublikat qorunması, statistika

          ### Quraşdırma
          - **Chrome**: zip-i açın → chrome://extensions → Developer mode → Load unpacked → `chrome/`
          - **Firefox**: `zai-autoresend-firefox-*.xpi` (və ya zip içindən `manifest.json`)
            → about:debugging → Load Temporary Add-on

          Testlər: unit 65/65, Chrome E2E 24 ssenari / 56 yoxlama, Firefox E2E 10
          yoxlama, addons-linter 0/0/0. SHA256SUMS.txt faylında imzalar.
          EOF
          )" \
            dist/zips/*.zip dist/zips/SHA256SUMS.txt
