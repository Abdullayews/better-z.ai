name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: npm ci

      - name: Prod build (zips)
        run: python3 build.py

      - name: SHA256SUMS
        run: |
          cd dist/zips
          rm -f SHA256SUMS.txt
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "better z.ai ${GITHUB_REF_NAME}" \
            --notes "$(cat <<'EOF'
          ## better z.ai — ${GITHUB_REF_NAME}

          An extension (Chrome + Firefox) that automatically resends your message
          with its attachments on **system is busy** and other send failures.

          ### New in this release
          - ⚡ Rust/WASM core (signature, backoff, classification) with a pure-JS
            fallback — verified by 1053 differential test vectors
          - 🤖 Captcha errors now retry after just 1 second (files preserved)
          - 🔁 Network-level capture/replay — attachments never get lost
          - X-Signature re-signing, exponential + adaptive backoff
          - 🖼️ Preview block, 📝 draft guard, 🧷 message rescue, ⚡ snippet library
          - ⤓ Chat export + ⤓⤓ full backup (.md + .json)
          - 🔔 "Response is ready" notification, 🚪 popup closer, ⏸ pause
          - 🎯 Serial retries, 🛡️ duplicate guard, 🔤 word counter
          - ⌨️ Shortcuts: Alt+R (Retry now), Alt+P (pause), Alt+E (export)

          ### Install
          - **Chrome**: unzip → chrome://extensions → Developer mode → Load unpacked → `chrome/`
          - **Firefox**: `better-z.ai-firefox.xpi` (or `manifest.json` inside the zip)
            → about:debugging → Load Temporary Add-on

          Tests: unit 85/85, Chrome E2E 24 scenarios / 56 checks, Firefox E2E 10
          checks, addons-linter 0/0/0. Checksums in SHA256SUMS.txt.
          EOF
          )" \
            dist/zips/*.zip dist/zips/SHA256SUMS.txt
