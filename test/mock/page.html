<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Z.ai Mock</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #161616; color: #f8f8f8; font: 14px/1.5 system-ui, sans-serif; }
  #nav { height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #ffffff1a; font-weight: 600; }
  #messages { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 300px; }
  .msg-user { align-self: flex-end; background: #2b2b2b; border-radius: 12px; padding: 9px 13px; max-width: 70%; white-space: pre-wrap; }
  .msg-assistant { align-self: flex-start; background: #202020; border-radius: 12px; padding: 9px 13px; max-width: 70%; white-space: pre-wrap; }
  .err { align-self: center; color: #f87171; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3); border-radius: 10px; padding: 8px 14px; max-width: 80%; }
  #composerWrap { position: fixed; left: 0; right: 0; bottom: 0; background: #1d1d1d; border-top: 1px solid #ffffff1a; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
  #chips:empty { display: none; }
  .chip { background: #262626; border: 1px solid #ffffff22; border-radius: 8px; padding: 3px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  #composer { flex: 1; background: #262626; color: #f8f8f8; border: 1px solid #ffffff22; border-radius: 12px; padding: 10px 12px; font: 14px/1.4 system-ui, sans-serif; resize: none; min-height: 42px; }
  button { cursor: pointer; border: none; }
  #attach { background: #262626; color: #adadad; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; }
  #send { background: #4099ff; color: #fff; border-radius: 50%; width: 38px; height: 38px; font-size: 16px; }
  #send:disabled { background: #555; }
  #fileInput { display: none; }
  .hint { color: #747474; font-size: 11px; padding: 0 16px 70px; }
</style>
</head>
<body>
  <div id="nav">Mock Z.ai — <span id="turnCount">0</span> gediş</div>
  <div id="messages"><div class="hint">Mock chat.z.ai səhifəsi (real protokol: /api/v2/chat/completions + X-Signature)</div></div>
  <div id="composerWrap">
    <div id="chips"></div>
    <div class="row">
      <button id="attach" title="Əlavə et">＋</button>
      <textarea id="composer" rows="1" placeholder="Mesaj yazın…"></textarea>
      <button id="send" title="Göndər">➤</button>
      <input id="fileInput" type="file" multiple>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
