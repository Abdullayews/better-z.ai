<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Z.ai Mock</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #161616; color: #f8f8f8; font: 14px/1.5 system-ui, sans-serif; }
  #nav { height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #ffffff1a; font-weight: 600; }
  #messages { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 300px; }
  .msg-user { align-self: flex-end; background: #2b2b2b; border-radius: 12px; padding: 9px 13px; max-width: 70%; white-space: pre-wrap; }
  .msg-assistant { align-self: flex-start; background: #202020; border-radius: 12px; padding: 9px 13px; max-width: 70%; white-space: pre-wrap; }
  .err { align-self: center; color: #f87171; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.3); border-radius: 10px; padding: 8px 14px; max-width: 80%; }
  #composerWrap { position: fixed; left: 0; right: 0; bottom: 0; background: #1d1d1d; border-top: 1px solid #ffffff1a; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
  #chips:empty { display: none; }
  .chip { background: #262626; border: 1px solid #ffffff22; border-radius: 8px; padding: 3px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  #composer { flex: 1; background: #262626; color: #f8f8f8; border: 1px solid #ffffff22; border-radius: 12px; padding: 10px 12px; font: 14px/1.4 system-ui, sans-serif; resize: none; min-height: 42px; }
  button { cursor: pointer; border: none; }
  #attach { background: #262626; color: #adadad; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; }
  #send { background: #4099ff; color: #fff; border-radius: 50%; width: 38px; height: 38px; font-size: 16px; }
  #send:disabled { background: #555; }
  #fileInput { display: none; }
  .hint { color: #747474; font-size: 11px; padding: 0 16px 70px; }
  .chip { cursor: pointer; }

  /* preview modalı (z.ai kimi: generasiya bitəndə ÖZ-ÖZÜNƏ açılır) */
  #previewModal {
    position: fixed; inset: 0; z-index: 5000; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.65);
  }
  #previewModal.open { display: flex; }
  #previewModal .modal-box {
    background: #202020; border: 1px solid #ffffff22; border-radius: 14px;
    padding: 18px; max-width: 440px; position: relative; text-align: center;
  }
  #previewModal .modal-title { font-size: 13px; color: #c9c9d6; margin-bottom: 10px; }
  #previewModal img { max-width: 380px; border-radius: 8px; display: block; }
  #previewClose {
    position: absolute; top: 8px; right: 8px; background: #2b2b2b; color: #f8f8f8;
    border-radius: 50%; width: 30px; height: 30px; border: none; cursor: pointer;
  }

  /* v1.2.0 test modalları — peak hours popapı və giriş (parol) dialoqu */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 5000; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.65);
  }
  .modal-overlay.open { display: flex; }
  .modal-overlay .modal-box {
    background: #202020; border: 1px solid #ffffff22; border-radius: 14px;
    padding: 18px; max-width: 440px; position: relative; text-align: center;
  }
  .modal-overlay .modal-title { font-size: 14px; color: #e8e8f0; margin-bottom: 8px; font-weight: 600; }
  .modal-overlay p { color: #9a9aa8; font-size: 13px; margin: 0 0 14px; }
  .modal-overlay button {
    background: #2b2b2b; color: #f8f8f8; border: 1px solid #ffffff22;
    border-radius: 9px; padding: 8px 16px; font-size: 13px; cursor: pointer; margin: 0 4px;
  }
  #authModal input {
    background: #262626; color: #f8f8f8; border: 1px solid #ffffff22;
    border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 220px; display: block; margin: 0 auto 14px;
  }
</style>
</head>
<body>
  <div id="nav">Mock Z.ai — <span id="turnCount">0</span> gediş</div>
  <div id="messages"><div class="hint">Mock chat.z.ai səhifəsi (real protokol: /api/v2/chat/completions + X-Signature)</div></div>
  <div id="composerWrap">
    <div id="chips"></div>
    <div class="row">
      <button id="attach" title="Əlavə et">＋</button>
      <textarea id="composer" rows="1" placeholder="Mesaj yazın…"></textarea>
      <button id="send" title="Göndər">➤</button>
      <input id="fileInput" type="file" multiple>
    </div>
  </div>

  <div id="previewModal" class="modal-overlay preview-modal" role="dialog" aria-modal="true" aria-label="Fayl preview">
    <div class="modal-box">
      <button id="previewClose" type="button" aria-label="Close">✕</button>
      <div class="modal-title">📄 Yaradılan faylın preview-i</div>
      <img alt="preview" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzODAiIGhlaWdodD0iMjQwIj48cmVjdCB3aWR0aD0iMzgwIiBoZWlnaHQ9IjI0MCIgZmlsbD0iIzQwOTlmZiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmaWxsPSIjZmZmIiBmb250LXNpemU9IjIwIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPm1vY2sgZmlsZSBwcmV2aWV3PC90ZXh0Pjwvc3ZnPg==">
    </div>
  </div>

  <!-- z.ai-in "peak hours" popapı (özlüyündən açılır) -->
  <div id="peakModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Pik saatlar xəbərdarlığı">
    <div class="modal-box">
      <div class="modal-title">⚠️ Currently in peak hours</div>
      <p>Traffic is high right now — answers may be slower than usual.</p>
      <button id="peakLater" type="button">Later</button>
      <button id="peakUpgrade" type="button">Upgrade</button>
    </div>
  </div>

  <!-- parol dialoqu — heç vaxt bağlanmamalıdır -->
  <div id="authModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Daxil ol">
    <div class="modal-box">
      <div class="modal-title">Sign in required</div>
      <p>Currently in peak hours — please sign in to continue.</p>
      <input type="password" placeholder="Şifrə" autocomplete="off">
      <button type="submit">Daxil ol</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
