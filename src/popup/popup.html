<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>better z.ai</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <img src="../icons/icon32.png" alt="" class="mark">
  <div class="brand">
    <div class="word">better <b>z.ai</b></div>
    <div class="conn" id="conn">—</div>
  </div>
</header>

<main>
  <section>
    <h3>Vəziyyət</h3>
    <div id="recList" class="recs"></div>
  </section>

  <section>
    <h3>Tez ayarlar</h3>
    <div class="rows">
      <div class="row">
        <div class="tx">
          <b>Preview bloku</b>
          <small>Fayl preview-i yalnız kliklə açılır</small>
        </div>
        <label class="sw"><input type="checkbox" id="sBlockPreview"><span class="sw-t"><span class="sw-k"></span></span></label>
      </div>
      <div class="row">
        <div class="tx">
          <b>Qaralama mühafizəsi</b>
          <small>Yazılan mətn itmir, yeniləmədən sonra bərpa</small>
        </div>
        <label class="sw"><input type="checkbox" id="sDraftGuard"><span class="sw-t"><span class="sw-k"></span></span></label>
      </div>
      <div class="row">
        <div class="tx">
          <b>Snippetlər</b>
          <small>Tez istifadə şablonları</small>
        </div>
        <label class="sw"><input type="checkbox" id="sSnippets"><span class="sw-t"><span class="sw-k"></span></span></label>
      </div>
      <div class="row">
        <div class="tx">
          <b>Popap bağlayıcı</b>
          <small>"Peak hours" tipli pəncərələr bağlanır</small>
        </div>
        <label class="sw"><input type="checkbox" id="sClosePopups"><span class="sw-t"><span class="sw-k"></span></span></label>
      </div>
    </div>
  </section>

  <section>
    <h3>Alətlər</h3>
    <div class="tools">
      <button id="btnExport" class="tool" title="Bu söhbəti Markdown faylı kimi yüklə">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Söhbəti ixrac et</span><span class="dim">.md</span>
      </button>
      <button id="btnBackup" class="tool" title="BÜTÜN söhbətləri .md + .json kimi yüklə">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <span>Tam backup</span><span class="dim">.md + .json</span>
      </button>
      <button id="btnPause" class="tool" title="Bütün avtomatik retry-ləri dayandır / davam etdir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span id="pauseLabel">Retry-ləri dayandır</span>
      </button>
    </div>
  </section>
</main>

<footer>
  <button id="btnOptions" class="opts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Bütün ayarlar</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</footer>

<script src="popup.js"></script>
</body>
</html>
